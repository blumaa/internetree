<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff0e6" />
      <stop offset="60%" stop-color="#bfe0cd" />
      <stop offset="100%" stop-color="#9ccdac" />
    </linearGradient>
    <radialGradient id="canopy" cx="40%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#80ed99" />
      <stop offset="100%" stop-color="#2b9348" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)" />
  <!-- tree -->
  <g transform="translate(600 360)">
    <ellipse cx="0" cy="150" rx="150" ry="26" fill="#3f6b50" opacity="0.18" />
    <rect x="-22" y="20" width="44" height="140" rx="10" fill="#7b5836" />
    <circle cx="0" cy="-10" r="120" fill="url(#canopy)" />
    <circle cx="-95" cy="30" r="70" fill="url(#canopy)" />
    <circle cx="95" cy="30" r="70" fill="url(#canopy)" />
    <circle cx="-55" cy="-90" r="64" fill="url(#canopy)" />
    <circle cx="60" cy="-85" r="64" fill="url(#canopy)" />
  </g>
  <text x="600" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="76" font-weight="600" fill="#234034">Internetree</text>
  <text x="600" y="585" text-anchor="middle" font-family="system-ui, sans-serif" font-size="40" fill="#3a5546">one tree, kept alive by the whole internet</text>
</svg>
