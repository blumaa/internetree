<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#cfe7da" />
    <title>Internetree</title>
    <meta name="description" content="One tree, kept alive by the whole internet. Tend it — or it dies." />

    <!-- Open Graph / social card (sharing is the growth loop). Crawlers want a raster
         image and many require an ABSOLUTE og:image URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Internetree" />
    <meta property="og:description" content="One tree, kept alive by the whole internet. Tend it — or it dies." />
    <meta property="og:image" content="https://internetree.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Internetree" />
    <meta name="twitter:description" content="One tree, kept alive by the whole internet. Tend it — or it dies." />
    <meta name="twitter:image" content="https://internetree.vercel.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
